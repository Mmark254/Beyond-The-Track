<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <style>
    .btk-ring {
      transform-origin: 24px 24px;
      animation: btkRingSpin 6s linear infinite;
    }
    @keyframes btkRingSpin {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -232; }
    }
    .btk-bolt {
      animation: btkBoltFlicker 3s ease-in-out infinite;
      transform-origin: 24px 24px;
    }
    @keyframes btkBoltFlicker {
      0%, 90%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #f59e0b); }
      92% { opacity: 0.4; filter: drop-shadow(0 0 2px #e11d48); }
      94% { opacity: 1; filter: drop-shadow(0 0 8px #fbbf24); }
      96% { opacity: 0.6; }
    }
    .btk-trail {
      transform-origin: left center;
      animation: btkTrailWhoosh 1.6s ease-out infinite;
    }
    .btk-trail-1 { animation-delay: 0s; }
    .btk-trail-2 { animation-delay: 0.25s; }
    .btk-trail-3 { animation-delay: 0.5s; }
    @keyframes btkTrailWhoosh {
      0% { transform: translateX(-6px) scaleX(0.3); opacity: 0; }
      40% { opacity: 1; }
      100% { transform: translateX(4px) scaleX(1.3); opacity: 0; }
    }
  </style>
  <circle cx="24" cy="24" r="21" stroke="url(#ringGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="100 132" transform="rotate(135 24 24)" class="btk-ring"/>
  <circle cx="24" cy="24" r="15" stroke="url(#ringGrad2)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="60 94" transform="rotate(135 24 24)" opacity="0.6"/>
  <line x1="24" y1="5" x2="24" y2="9" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="43" y1="24" x2="39" y2="24" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="5" y1="24" x2="9" y2="24" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M26 13L17 26h6l-2 9 11-14h-6l2-8z" fill="url(#boltGrad)" class="btk-bolt"/>
  <line x1="6" y1="34" x2="14" y2="34" stroke="url(#trailGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.7" class="btk-trail btk-trail-1"/>
  <line x1="4" y1="38" x2="11" y2="38" stroke="url(#trailGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.5" class="btk-trail btk-trail-2"/>
  <line x1="7" y1="42" x2="13" y2="42" stroke="url(#trailGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.3" class="btk-trail btk-trail-3"/>
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e11d48"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="17" y1="13" x2="32" y2="35" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="trailGrad" x1="4" y1="0" x2="14" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e11d48" stop-opacity="0"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
</svg>
